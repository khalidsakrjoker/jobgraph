[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobgraph"
version = "0.1.0"
description = "DAG workflow/job orchestration engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "khalidsakrjoker", email = "khalidsakr720@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
